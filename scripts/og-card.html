<!doctype html>
<!--
  The source of legal/og.png, the card every share of the site shows.

  It borrows the site's own stylesheet so the card cannot drift from the page,
  and it is rendered rather than drawn: serve legal/ (for example
  `python3 -m http.server --directory legal 4174`), open this file at a
  1200x630 viewport with that origin, and save a 1x screenshot of `.card`
  over legal/og.png. Nothing in the build reads this file.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tiny Tempo — social card</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="http://127.0.0.1:4174/market.css" />
    <style>
      body { margin: 0; }
      .card {
        position: relative;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: center;
        gap: 2rem;
        width: 1200px;
        height: 630px;
        padding: 0 4rem;
        overflow: hidden;
        background:
          radial-gradient(760px 520px at 22% -60px, rgba(223, 195, 127, 0.62), transparent 68%),
          radial-gradient(560px 420px at 92% 10%, rgba(207, 81, 52, 0.12), transparent 70%),
          var(--paper);
      }
      .card .sign { width: 430px; margin-bottom: 1.6rem; animation: none; transform: none; }
      .card .phone { width: 300px; animation: none; transform: rotate(-3deg); }
      .card .lede { font-size: 2.1rem; max-width: 18ch; margin-bottom: 1rem; }
      .card .stat-strip { margin-top: 1.4rem; }
      .card .badge { position: absolute; left: 4rem; top: 2.4rem; margin: 0; }
      .card .col { position: relative; padding-top: 4.5rem; }
      .card .bead, .card .hammer, .card .glow, .card .chips i, .card .mini-face i, .card .mini-baton { animation: none; }
      .card .socket-note { margin-top: 0.4rem; color: var(--muted); font-weight: 800; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="badge"><span class="badge-dot"></span>Coming to Google&nbsp;Play</p>
      <div class="col">
        <div class="sign">
          <div class="ropes"><span></span><span></span></div>
          <div class="board">
            <p class="kicker">120 BPM</p>
            <h1>Tiny<br />Tempo</h1>
            <div class="beads"><span class="bead"></span><span class="bead"></span><span class="bead"></span><span class="bead"></span></div>
          </div>
        </div>
        <p class="lede">Watch a tiny everyday rhythm. Tap it back.</p>
        <ul class="stat-strip">
          <li><b>20</b><span>acts</span></li>
          <li><b>±55<i>ms</i></b><span>perfect</span></li>
          <li><b>120<i>→</i>150</b><span>BPM</span></li>
          <li><b>1</b><span>thumb</span></li>
        </ul>
      </div>
      <div class="phone-wrap">
        <div class="phone">
          <span class="phone-shadow"></span>
          <div class="screen">
            <div class="hud">
              <span class="hud-area">Area 1 · Level 3</span>
              <span class="hud-pips"><i class="done"></i><i class="done"></i><i></i><i></i></span>
            </div>
            <span class="glow"></span>
            <span class="bench"></span>
            <span class="stand"></span>
            <span class="hammer">
              <span class="hammer-handle"></span>
              <span class="hammer-grip"></span>
              <span class="hammer-head"></span>
            </span>
            <div class="mini-turn">
              <div class="mini-shelf"><i></i><i></i><i></i><i></i></div>
              <div class="mini-face"><i></i><i></i><i></i><i></i></div>
              <span class="mini-baton"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
