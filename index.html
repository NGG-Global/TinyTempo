<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Mobile viewport contract:
      - `width=device-width, initial-scale=1` maps CSS pixels to device pixels.
      - `maximum-scale=1, user-scalable=no` suppresses pinch-zoom and the
        double-tap zoom gesture, which would otherwise fight touch controls.
      - `viewport-fit=cover` lets the page paint under a notch / cutout; the
        safe-area insets below keep interactive content clear of it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#eee8d8" />
    <!-- Generated from the one master in assets/icon/ by `npm run icons`. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Tiny Tempo: a rhythm, a hammer, a little resolve." />

    <!-- Treat as a standalone app surface when launched from a home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Tiny Tempo — Rhythm in the Everyday</title>

    <style>
      @font-face {
        font-family: 'Fredoka';
        src: url('./fonts/fredoka/Fredoka.ttf') format('truetype');
        font-weight: 300 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Nunito';
        src: url('./fonts/nunito/Nunito.ttf') format('truetype');
        font-weight: 200 1000;
        font-style: normal;
        font-display: swap;
      }

      :root {
/* Shell palette. Mirrored in src/config/theme.ts (PALETTE), the theme-color
           meta tag above, capacitor.config.ts and android values/colors.xml. These
           paint before the bundle loads, so they cannot import anything. */
        --shell-bg: #eee8d8;
        --shell-fg: #243e35;
        --shell-muted: #4e5a52;
        --shell-accent: #cf5134;

        /* Notch / rounded-corner insets, 0 on hardware without them. */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--shell-bg);
        color: var(--shell-fg);
        font-family: 'Nunito', system-ui, sans-serif;

        /* Kill browser-level touch behaviour that competes with game input:
           pull-to-refresh, overscroll glow, long-press selection, tap flash. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      /*
        `position: fixed` plus `100dvh` keeps the canvas stable while Android
        Chrome collapses and re-expands its URL bar. `100vh` is the fallback
        for engines without dynamic viewport units; it over-reports height
        slightly, which the Scale Manager corrects on its first resize pass.
      */
      #game-root {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        display: block;
        overflow: hidden;
      }

      #game-root canvas {
        display: block;
        touch-action: none;
      }

      /* Shared full-bleed overlay layout for the boot and orientation panels. */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        padding: calc(var(--safe-top) + 1.5rem) calc(var(--safe-right) + 1.5rem)
          calc(var(--safe-bottom) + 1.5rem) calc(var(--safe-left) + 1.5rem);
        background: var(--shell-bg);
        text-align: center;
      }

      .overlay[hidden] {
        display: none;
      }

      .overlay__title {
        margin: 0;
        font-family: 'Fredoka', system-ui, sans-serif;
        font-size: 1.35rem;
        font-weight: 700;
      }

      .overlay__note {
        margin: 0;
        max-width: 22rem;
        font-size: 0.85rem;
        line-height: 1.5;
        color: var(--shell-muted);
      }

      /*
        The loading ring carries the same weight of edge as the game's own drawing,
        so the first thing on screen already belongs to it. System type stays here:
        the bundled faces are not fetched until Phaser loads them, and swapping the
        overlay's font mid-boot would flash.
      */
      .spinner {
        width: 2.25rem;
        height: 2.25rem;
        border: 4px solid rgba(36, 62, 53, 0.18);
        border-top-color: var(--shell-accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }

      /* Respect a reduced-motion preference; the spinner is decorative. */
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }

      /*
        Save-code entry. The one place the game asks for typed text, and the reason it
        is DOM rather than canvas: a real `<input>` is what opens the system keyboard in
        an Android WebView, with the platform's own selection, paste and autocorrect
        handling. Drawing a keypad on the canvas would reimplement all of that worse.
      */
      #code-overlay {
        justify-content: center;
        gap: 1.1rem;
        /* The body suppresses selection and browser touch handling for the canvas'
           benefit; inside this panel both have to come back or the field is unusable. */
        touch-action: auto;
        -webkit-user-select: text;
        user-select: text;
      }

      #code-input {
        width: min(20rem, 100%);
        padding: 0.75rem 0.85rem;
        border: 3px solid var(--shell-fg);
        border-radius: 0.7rem;
        background: #fff;
        color: var(--shell-fg);
        font-family: 'Nunito', system-ui, sans-serif;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }

      #code-input:focus {
        outline: none;
        border-color: var(--shell-accent);
      }

      .code-actions {
        display: flex;
        gap: 0.7rem;
      }

      .code-button {
        min-width: 7rem;
        /* 48 CSS px, the same accessible floor LAYOUT.minTouchTarget sets on the canvas. */
        min-height: 3rem;
        padding: 0 1.1rem;
        border: none;
        border-radius: 0.7rem;
        background: var(--shell-accent);
        color: #fff8ec;
        font-family: 'Fredoka', system-ui, sans-serif;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      .code-button--quiet {
        background: transparent;
        border: 3px solid var(--shell-muted);
        color: var(--shell-fg);
      }

      .rotate-icon {
        width: 2.5rem;
        height: 4rem;
        border: 4px solid var(--shell-accent);
        border-radius: 0.6rem;
        animation: nudge 2.2s ease-in-out infinite;
      }

      @keyframes nudge {
        0%,
        45%,
        100% {
          transform: rotate(90deg);
        }
        60%,
        90% {
          transform: rotate(0deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .rotate-icon {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Phaser injects its canvas here (see `scale.parent` in the game config). -->
    <div id="game-root" aria-label="Game canvas" role="application"></div>

    <!--
      Server-rendered boot panel. A blank screen on a slow mobile connection
      reads as a broken page, so the shell shows this immediately and the game
      hides it once the first scene is running.
    -->
    <div class="overlay" id="boot-overlay" role="status" aria-label="Loading">
      <div class="spinner"></div>
      <p class="overlay__title" id="boot-title" hidden></p>
      <p class="overlay__note" id="boot-error" hidden></p>
      <!--
        A player whose game will not start cannot reach Settings, so this is the only
        place they can be given an address. Hidden until there is a failure to report.
      -->
      <p class="overlay__note" id="boot-contact" hidden></p>
    </div>

    <!--
      Portrait is the design orientation. The browser cannot lock orientation
      outside fullscreen on Android, so the game prompts instead of forcing.
    -->
    <div class="overlay" id="orientation-overlay" hidden>
      <div class="rotate-icon"></div>
      <p class="overlay__title">Portrait, please</p>
    </div>

    <!--
      Save-code entry, shown by `core/shell.ts` and hidden the rest of the time. See
      docs/SAVES.md for why restoring merges rather than replaces.
    -->
    <div class="overlay" id="code-overlay" role="dialog" aria-modal="true" aria-labelledby="code-title" hidden>
      <p class="overlay__title" id="code-title">Enter a save code</p>
      <p class="overlay__note">Paste or type the code from your other device. Dashes and spacing don’t matter.</p>
      <input
        id="code-input"
        type="text"
        inputmode="text"
        autocapitalize="characters"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        aria-labelledby="code-title"
      />
      <div class="code-actions">
        <button type="button" class="code-button code-button--quiet" id="code-cancel">Cancel</button>
        <button type="button" class="code-button" id="code-confirm">Restore</button>
      </div>
    </div>

    <!--
      Last resort, and deliberately not a module.

      A device that refuses every canvas context takes Phaser's import-time feature
      detection down with it, so `/src/main.ts` never evaluates and nothing in the bundle
      — not the error capture, not `showBootError` — ever runs. Measured in a browser: two
      uncaught errors fire and the player is left watching the spinner turn, with no
      message and no way to tell anyone. This is the only code that can still speak.

      The address is duplicated from `src/config/support.ts` for the same reason the
      palette above is duplicated from `config/theme.ts`: this has to work before anything
      can be imported. Change them together.
    -->
    <script>
      (function () {
        var ADDRESS = 'dor1612@gmail.com';
        function stranded(detail) {
          var overlay = document.getElementById('boot-overlay');
          var title = document.getElementById('boot-title');
          var note = document.getElementById('boot-error');
          var contact = document.getElementById('boot-contact');
          if (!overlay || !title || !note || !contact) return;
          // Gone means the game started; already titled means showBootError got there
          // first, from a bundle that did load. Either way this has nothing to add.
          if (overlay.hasAttribute('hidden') || !title.hasAttribute('hidden')) return;
          var spinner = overlay.querySelector('.spinner');
          if (spinner) spinner.remove();
          title.textContent = 'Unable to start';
          title.removeAttribute('hidden');
          note.textContent = 'The game could not start on this device. (' + detail + ')';
          note.removeAttribute('hidden');
          contact.textContent = 'Please tell us: ' + ADDRESS;
          contact.removeAttribute('hidden');
        }
        window.addEventListener('error', function (event) {
          stranded((event && event.message) || 'unknown error');
        });
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
