ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    playBillingVersion = '9.1.0'
    playAppUpdateVersion = '2.1.0'
    // Play In-App Review, the same partitioned Play Core family. Pinned for the same reason.
    playReviewVersion = '2.0.2'
    // Play Games Services v2. Pinned rather than '+': this is the SDK an
    // authentication path depends on, and a dynamic version makes two builds of the
    // same commit differ. The deprecated v1 artifact (play-services-games) is not
    // used and must not be added — v2 pulls only base, basement and tasks.
    playGamesVersion = '22.1.0'
    // The Mobile Ads SDK and UMP, which @capacitor-community/admob reads by these names and
    // would otherwise take as '25.4.+': a dynamic version makes two builds of one commit
    // differ in the SDK that serves ads and asks for consent. 25.4.0 is the newest in the
    // plugin's own range; move both deliberately, after reading Google's release notes.
    playServicesAdsVersion = '25.4.0'
    userMessagingPlatformVersion = '4.0.0'
    // Unity Ads as a bidding source behind AdMob mediation, never on its own: AdMob loads,
    // shows and initialises it. The pair is the one Google's changelog says adapter 4.20.1.0
    // was built and tested with, beside Mobile Ads 25.4.0 above; the adapter's POM depends on
    // exactly that play-services-ads. Move all three together, after reading the changelog
    // at developers.google.com/admob/android/mediation/unity. See docs/UNITY_MEDIATION.md.
    unityAdsVersion = '4.20.1'
    unityMediationAdapterVersion = '4.20.1.0'
}