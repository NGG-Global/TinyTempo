name: GitHub Pages

# Publishes the static marketing site in legal/ to GitHub Pages, including the
# Privacy Policy and Terms of Service the Play Console listing needs. Enable
# Pages in the repository settings with Source set to GitHub Actions. After
# the first successful run the public URLs are:
#   https://tinytempo.games/
#   https://tinytempo.games/privacy/
#   https://tinytempo.games/terms/
#   https://tinytempo.games/legal/
#
# The custom domain is set in Settings → Pages; an Actions deploy ignores a
# CNAME file. Every github.io/TinyTempo URL 301s to it, so the canonicals,
# og:url, sitemap and robots.txt in legal/ must name tinytempo.games: pointing
# Google at the github.io URLs is what Search Console reported as "Page with
# redirect".

on:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: legal

      - id: deployment
        uses: actions/deploy-pages@v4
